ont-weight="400" fill="#8f8d85" text-anchor="start" class="fadein" style="animation-delay:1.22s">The size of the diff you still owe a review.</text><line x1="20" x2="434" y1="386" y2="386" stroke="#2a2a27" stroke-width="1"/><circle cx="30" cy="403" r="8.5" fill="#251f13" stroke="#c8a96e" stroke-width="1" class="fadein" style="animation-delay:1.24s"/><text x="30" y="407" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#c8a96e" text-anchor="middle" class="fadein" style="animation-delay:1.24s">5</text><text x="48" y="407" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#c8a96e" text-anchor="start" letter-spacing="0.16em" class="fadein" style="animation-delay:1.24s">TOKENS</text><text x="48" y="426" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#8f8d85" text-anchor="start" class="fadein" style="animation-delay:1.28s">Context used against the window, 64k of 200k.</text><text x="48" y="442" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#8f8d85" text-anchor="start" class="fadein" style="animation-delay:1.28s">The 1M tier is detected, never assumed.</text><line x1="446" x2="860" y1="386" y2="386" stroke="#2a2a27" stroke-width="1"/><circle cx="456" cy="403" r="8.5" fill="#251f13" stroke="#c8a96e" stroke-width="1" class="fadein" style="animation-delay:1.30s"/><text x="456" y="407" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#c8a96e" text-anchor="middle" class="fadein" style="animation-delay:1.30s">6</text><text x="474" y="407" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#c8a96e" text-anchor="start" letter-spacing="0.16em" class="fadein" style="animation-delay:1.30s">PROJECT</text><text x="474" y="426" font-family="