 UI',Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#c8a96e" text-anchor="start" letter-spacing="0.16em" class="fadein" style="animation-delay:1.00s">MODEL</text><text x="48" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#8f8d85" text-anchor="start" class="fadein" style="animation-delay:1.04s">Which model is answering, straight from</text><text x="48" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#8f8d85" text-anchor="start" class="fadein" style="animation-delay:1.04s">the session JSON&#x27;s model.display_name.</text><line x1="446" x2="860" y1="246" y2="246" stroke="#2a2a27" stroke-width="1"/><circle cx="456" cy="263" r="8.5" fill="#251f13" stroke="#c8a96e" stroke-width="1" class="fadein" style="animation-delay:1.06s"/><text x="456" y="267" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" fill="#c8a96e" text-anchor="middle" class="fadein" style="animation-delay:1.06s">2</text><text x="474" y="267" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="600" fill="#c8a96e" text-anchor="start" letter-spacing="0.16em" class="fadein" style="animation-delay:1.06s">CONTEXT LEFT</text><text x="474" y="286" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#8f8d85" text-anchor="start" class="fadein" style="animation-delay:1.10s">Ten cells of headroom before auto-compact.</text><text x="474" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" font-weight="400" fill="#8f8d85" text-anchor="start" class="fadein" style="animation-delay:1.10s">Here 68% of the window is still free.</text><line x1="20" x2="434" y1="316" y2="316" stroke="#2a2a27" stroke-width="1"/><circle cx="30" cy="333" r="8.5" fill="#251f13" stroke="#c8a96e" stroke-width="1" 